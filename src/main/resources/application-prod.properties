cors.origin.urls=https://app.simakerja.com

server.forward-headers-strategy=framework

# App
app.frontend.url=https://app.simakerja.com
app.cookie.secure=true

# Datasource - Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgresdb}:5432/${POSTGRES_DB}?sslmode=disable

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379

# Minio
minio.url=${MINIO_ENDPOINT:http://minio:9000}
minio.ssl=false
minio.bucket.name=partner-assets
minio.presigned.expiry=60
minio.public.url=https://storage.simakerja.com

# JWT
jwt.secret=${JWT_SECRET_KEY}
