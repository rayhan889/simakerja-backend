name: cd.yml - Deploy to production
on:
  push:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  version-and-build:
    name: Version, build and push
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_version }}
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          pre_release_branches: develop,staging
          tag_prefix: v

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build with Maven (skip tests)
        run: ./mvnw clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag_version.outputs.new_version }}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_version }}
          body: ${{ steps.tag_version.outputs.changelog }}
          draft: false
          prerelease: false

  deploy-to-vps:
    name: Deploy to VPS
    needs: version-and-build
    runs-on: self-hosted
    env:
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          cp docker-compose.prod.yml $VPS_DEPLOY_PATH/docker-compose.prod.yml
          
          cd $VPS_DEPLOY_PATH
          echo 'Pulling latest image...'
          docker compose --env-file .env.prod -f docker-compose.prod.yml pull spring-api

          if docker compose --env-file .env.prod -f docker-compose.prod.yml up -d spring-api 2>&1 | grep -q "network"; then
            echo 'Compose config changed, performing full restart...'
            docker compose --env-file .env.prod -f docker-compose.prod.yml down
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
          else
            echo 'Restarted spring-api service.'
          fi

          echo 'Cleaning up old images...'
          docker image prune -f
          echo 'Deployment completed!'

      - name: Wait service to be healthy
        run: |
          cd $VPS_DEPLOY_PATH
          echo 'Waiting for service to become healthy...'
          timeout 120 bash -c "until docker compose --env-file .env.prod -f docker-compose.prod.yml ps spring-api | grep -q '(healthy)'; do echo 'Waiting...'; sleep 5; done"
          echo 'Service status:'
          docker compose --env-file .env.prod -f $VPS_DEPLOY_PATH/docker-compose.prod.yml ps spring-api
      
      - name: Notify success deployment
        if: success()
        run: |
          cd $VPS_DEPLOY_PATH
          echo "Deployment successful!"
          echo "Version: ${{ needs.version-and-build.outputs.new_version }}"
          echo "Tag: ${{ needs.version-and-build.outputs.new_tag }}"
          
      - name: Notify deployment failure
        if: failure()
        run: |
          cd $VPS_DEPLOY_PATH
          echo "Deployment failed!"
          echo "Check the logs and rollback if necessary."
