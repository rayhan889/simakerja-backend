services:
  postgresdb:
    ports:
      - "127.0.0.1:5432:5432"
    image: postgres:16.2
    restart: unless-stopped
    networks:
      - simakerja_net
    volumes:
      - simakerja_postgres_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    restart: unless-stopped
    networks:
      - simakerja_net
    volumes:
      - simakerja_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    networks:
      - simakerja_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://storage.simakerja.com
    command: server --console-address ":9090" /data
    volumes:
      - simakerja_minio_data:/data

  spring-api:
    image: ghcr.io/rayhan889/simakerja-backend:latest
    restart: unless-stopped
    networks:
      - simakerja_net
    depends_on:
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgresdb
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_SECRET_KEY: ${GOOGLE_SECRET_KEY}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      ADMIN_SEED_PROMOTE_TO_SUPERADMIN: ${ADMIN_SEED_PROMOTE_TO_SUPERADMIN}
      ADMIN_SEED_FULL_NAME: ${ADMIN_SEED_FULL_NAME}
      MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    networks:
      - simakerja_net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./react-dist:/srv

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks:
      - simakerja_net
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  simakerja_postgres_data_prod:
  simakerja_redis_data:
  simakerja_minio_data:
  simakerja_caddy_data:
  simakerja_caddy_config:

networks:
  simakerja_net:
    driver: bridge